name: evolution

services:
  evolution:
    image: evolution-api:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVO_POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: ${EVO_DATABASE_CLIENT_NAME:-evolution_local}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/${EVO_REDIS_DB:-1}
      CACHE_REDIS_PREFIX_KEY: ${EVO_REDIS_PREFIX:-evolution_local}
      CACHE_REDIS_SAVE_INSTANCES: ${EVO_CACHE_REDIS_SAVE_INSTANCES:-true}
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVO_AUTHENTICATION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      SERVER_URL: https://evolution.promoclubes.com.br
      SERVER_PORT: "8080"
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      SYNC_FULL_HISTORY: "false"
      CHATWOOT_ENABLED: "false"
      LOG_LEVEL: ERROR
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [default, internal]

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVO_POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [default]

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [default]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    external: true
    name: promoclubes-internal
